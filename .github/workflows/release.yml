name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify release source
        run: npm test

      - name: Build portable Windows application
        run: npm run package:windows

      - name: Create archive and checksum
        id: archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $archive = "VoidCat-Harness-$tag-windows-x64.zip"
          Compress-Archive -Path "release\VoidCat Harness-win32-x64\*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content -LiteralPath "$archive.sha256" -Encoding ascii
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "${{ steps.archive.outputs.archive }}"
          gh release create "${{ github.ref_name }}" $archive "$archive.sha256" --verify-tag --generate-notes --title "VoidCat Harness ${{ github.ref_name }}"
