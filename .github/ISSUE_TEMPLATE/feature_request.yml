name: Feature request
description: Suggest a bounded, privacy-preserving improvement.
title: "[FEATURE] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, network, or storage impact
      description: Explain what would leave the computer and how traffic or disk growth stays bounded.
    validations:
      required: true
